<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,user-scalable=no">

<title>Una estrella para ti ⭐</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02000b;
    font-family:Georgia,serif;
}

/* =========================
   FONDO GALAXIA
========================= */

body{
    background:
        radial-gradient(circle at 50% 50%,
            rgba(112,55,150,.28),
            transparent 30%),
        radial-gradient(circle at 20% 30%,
            rgba(255,190,80,.13),
            transparent 25%),
        radial-gradient(circle at 80% 70%,
            rgba(60,40,160,.18),
            transparent 30%),
        linear-gradient(135deg,#02000b,#09001c 45%,#010008);
}

/* nebulosa */

.nebula{
    position:absolute;
    width:120vw;
    height:70vh;
    left:-10vw;
    top:15vh;

    background:
        radial-gradient(ellipse,
        rgba(255,210,100,.16),
        rgba(150,70,180,.08) 35%,
        transparent 70%);

    filter:blur(35px);
    transform:rotate(-20deg);
    animation:nebulaMove 12s ease-in-out infinite alternate;
}

@keyframes nebulaMove{
    from{
        transform:rotate(-20deg) scale(1);
    }
    to{
        transform:rotate(-13deg) scale(1.12);
    }
}

/* =========================
   ESTRELLAS DEL CIELO
========================= */

.sky-star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    box-shadow:0 0 5px white;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.25;transform:scale(.7);}
    to{opacity:1;transform:scale(1.5);}
}

/* =========================
   PANTALLA INICIO
========================= */

#startScreen{
    position:fixed;
    inset:0;
    z-index:1000;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(circle,
        rgba(40,10,60,.2),
        rgba(0,0,8,.95));

    color:white;
    cursor:pointer;

    transition:
        opacity 1.2s ease,
        visibility 1.2s ease;
}

#startScreen.hide{
    opacity:0;
    visibility:hidden;
}

.flower-start{
    font-size:62px;
    filter:
        drop-shadow(0 0 10px #ffd900)
        drop-shadow(0 0 25px #ffb300);

    animation:flowerPulse 2s infinite ease-in-out;
}

@keyframes flowerPulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.15) rotate(5deg);
    }
}

.start-text{
    margin-top:25px;
    font-size:18px;
    letter-spacing:3px;
    opacity:.9;
    animation:blink 1.8s infinite;
}

@keyframes blink{
    50%{opacity:.35;}
}

/* =========================
   ESTRELLA CENTRAL
========================= */

#universe{
    position:absolute;
    inset:0;
    opacity:0;
    transition:opacity 2s;
}

#universe.show{
    opacity:1;
}

.star-container{
    position:absolute;
    left:50%;
    top:50%;

    width:230px;
    height:230px;

    transform:translate(-50%,-50%);
}

.star-glow{
    position:absolute;
    inset:0;

    border-radius:50%;

    background:
        radial-gradient(circle,
        rgba(255,255,210,.95) 0%,
        rgba(255,220,70,.65) 18%,
        rgba(255,170,20,.25) 42%,
        transparent 70%);

    filter:blur(10px);
    animation:glow 2.5s infinite alternate;
}

@keyframes glow{
    from{
        transform:scale(.9);
        opacity:.65;
    }
    to{
        transform:scale(1.15);
        opacity:1;
    }
}

/* estrella */

.star{
    position:absolute;
    left:50%;
    top:50%;

    width:125px;
    height:125px;

    transform:translate(-50%,-50%) rotate(45deg);

    background:
        linear-gradient(
            135deg,
            #fffde1,
            #fff176 30%,
            #ffc107 65%,
            #ff8f00
        );

    clip-path:polygon(
        50% 0%,
        61% 36%,
        100% 50%,
        61% 61%,
        50% 100%,
        39% 61%,
        0% 50%,
        39% 36%
    );

    filter:
        drop-shadow(0 0 8px #fff)
        drop-shadow(0 0 25px #ffd000)
        drop-shadow(0 0 55px #ff9800);

    animation:
        starFloat 4s ease-in-out infinite,
        starRotate 12s linear infinite;
}

@keyframes starFloat{
    0%,100%{
        transform:
            translate(-50%,-50%)
            rotate(45deg)
            scale(1);
    }

    50%{
        transform:
            translate(-50%,-50%)
            rotate(45deg)
            scale(1.08);
    }
}

@keyframes starRotate{
    from{
        filter:
            drop-shadow(0 0 8px #fff)
            drop-shadow(0 0 25px #ffd000)
            drop-shadow(0 0 55px #ff9800);
    }

    to{
        filter:
            drop-shadow(0 0 15px #fff)
            drop-shadow(0 0 40px #ffd000)
            drop-shadow(0 0 75px #ff9800);
    }
}

/* =========================
   FLORES
========================= */

.flower{
    position:absolute;
    font-size:30px;

    filter:
        drop-shadow(0 0 7px #ffd600)
        drop-shadow(0 0 15px rgba(255,190,0,.6));

    animation:
        flowerOrbit linear infinite;
}

@keyframes flowerOrbit{
    from{
        transform:
            rotate(0deg)
            translateX(var(--radius))
            rotate(0deg);
    }

    to{
        transform:
            rotate(360deg)
            translateX(var(--radius))
            rotate(-360deg);
    }
}

/* =========================
   TEXTO
========================= */

.message{
    position:absolute;

    left:50%;
    bottom:8%;

    width:90%;

    transform:translateX(-50%);

    text-align:center;

    color:white;

    opacity:0;
    animation:messageIn 2s 2s forwards;
}

.message h1{
    font-size:28px;
    font-weight:normal;

    letter-spacing:4px;

    color:#fff5a0;

    text-shadow:
        0 0 8px #ffd000,
        0 0 20px #ffb300;
}

.message p{
    margin-top:12px;

    font-size:15px;
    line-height:1.7;

    color:#eee;
    opacity:.85;
}

@keyframes messageIn{
    to{
        opacity:1;
    }
}

/* =========================
   FLORES VOLANDO
========================= */

.flying-flower{
    position:absolute;
    font-size:24px;

    animation:
        fly 6s linear forwards;

    pointer-events:none;
}

@keyframes fly{
    0%{
        transform:
            translate(0,0)
            rotate(0deg)
            scale(.5);

        opacity:0;
    }

    15%{
        opacity:1;
    }

    100%{
        transform:
            translate(
                var(--x),
                var(--y)
            )
            rotate(720deg)
            scale(1.2);

        opacity:0;
    }
}

/* =========================
   BRILLOS
========================= */

.sparkle{
    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 8px #fff,
        0 0 15px #ffd000;

    animation:
        sparkle 2s infinite alternate;
}

@keyframes sparkle{
    from{
        opacity:.1;
        transform:scale(.4);
    }

    to{
        opacity:1;
        transform:scale(1.8);
    }
}

/* móvil */

@media(max-width:500px){

    .star-container{
        width:210px;
        height:210px;
    }

    .star{
        width:110px;
        height:110px;
    }

    .message h1{
        font-size:24px;
    }

    .message p{
        font-size:14px;
    }
}
</style>
</head>

<body>

<!-- =========================
     PANTALLA DE INICIO
========================= -->

<div id="startScreen">

    <div class="flower-start">🌻</div>

    <div class="start-text">
        Toca para iniciar
    </div>

</div>


<!-- =========================
     UNIVERSO
========================= -->

<div id="universe">

    <div class="nebula"></div>

    <!-- ESTRELLA -->

    <div class="star-container">

        <div class="star-glow"></div>

        <div class="star"></div>

    </div>


    <!-- FLORES EN ÓRBITA -->

    <div class="flower"
         style="
         left:50%;
         top:50%;
         --radius:145px;
         animation-duration:12s;">
        🌻
    </div>

    <div class="flower"
         style="
         left:50%;
         top:50%;
         --radius:170px;
         animation-duration:16s;
         animation-delay:-4s;">
        🌻
    </div>

    <div class="flower"
         style="
         left:50%;
         top:50%;
         --radius:195px;
         animation-duration:20s;
         animation-delay:-10s;">
        🌻
    </div>

    <div class="flower"
         style="
         left:50%;
         top:50%;
         --radius:125px;
         animation-duration:10s;
         animation-delay:-5s;">
        🌻
    </div>


    <!-- MENSAJE -->

    <div class="message">

        <h1>UNA ESTRELLA PARA TI ✨</h1>

        <p>
            Entre todas las estrellas del universo,
            siempre habrá una que brille especialmente para ti.
        </p>

    </div>

</div>


<script>

/* =====================================
   CREAR ESTRELLAS DEL CIELO
===================================== */

for(let i=0;i<120;i++){

    const star=document.createElement("div");

    star.className="sky-star";

    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";

    const size=Math.random()*2+1;

    star.style.width=size+"px";
    star.style.height=size+"px";

    star.style.animationDelay=
        Math.random()*3+"s";

    star.style.animationDuration=
        (1+Math.random()*3)+"s";

    document.getElementById("universe")
        .appendChild(star);
}


/* =====================================
   CREAR BRILLOS
===================================== */

for(let i=0;i<35;i++){

    const sparkle=document.createElement("div");

    sparkle.className="sparkle";

    sparkle.style.left=
        Math.random()*100+"%";

    sparkle.style.top=
        Math.random()*100+"%";

    sparkle.style.animationDelay=
        Math.random()*3+"s";

    document.getElementById("universe")
        .appendChild(sparkle);
}


/* =====================================
   INICIAR EXPERIENCIA
===================================== */

const startScreen=
    document.getElementById("startScreen");

const universe=
    document.getElementById("universe");

startScreen.addEventListener("click",start);

startScreen.addEventListener("touchstart",
    start,
    {passive:true}
);

function start(){

    startScreen.classList.add("hide");

    universe.classList.add("show");

    setTimeout(createFlyingFlowers,1000);

}


/* =====================================
   FLORES VOLANDO
===================================== */

function createFlyingFlowers(){

    for(let i=0;i<25;i++){

        setTimeout(()=>{

            const flower=
                document.createElement("div");

            flower.className=
                "flying-flower";

            flower.innerHTML="🌻";

            flower.style.left=
                (45+Math.random()*10)+"%";

            flower.style.top=
                (45+Math.random()*10)+"%";

            flower.style.setProperty(
                "--x",
                ((Math.random()-.5)*1000)+"px"
            );

            flower.style.setProperty(
                "--y",
                ((Math.random()-.5)*1000)+"px"
            );

            flower.style.animationDuration=
                (4+Math.random()*4)+"s";

            document.body.appendChild(flower);

            setTimeout(()=>{
                flower.remove();
            },8000);

        },i*180);
    }
}


/* =====================================
   HACER QUE LA ESTRELLA RESPONDA AL TOQUE
===================================== */

const star=
    document.querySelector(".star");

star.addEventListener("click",()=>{

    star.animate(
        [
            {
                transform:
                    "translate(-50%,-50%) rotate(45deg) scale(1)"
            },
            {
                transform:
                    "translate(-50%,-50%) rotate(45deg) scale(1.35)"
            },
            {
                transform:
                    "translate(-50%,-50%) rotate(45deg) scale(1)"
            }
        ],
        {
            duration:800,
            easing:"ease-in-out"
        }
    );

    createFlyingFlowers();

});

</script>

</body>
</html>
